
name: Build RightVisuals Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name RightVisuals main.py

      - name: Upload launcher
        uses: actions/upload-artifact@v4
        with:
          name: RightVisuals-Windows
          path: dist/RightVisuals.exe
